name: Idea or feature request
description: Suggest something new for Typecase
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please have a look at the [roadmap](https://github.com/kleinod-studio/Typecase/blob/main/ROADMAP.md) first. It lists what is planned, and what Typecase deliberately will not do.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to achieve, and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Your idea of how it could look and behave.
